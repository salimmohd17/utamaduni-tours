services:
  - type: web
    name: utamaduni-safaris-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false

      # --- Email (Gmail SMTP via App Password) ---
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      # SMTP_PASS is set privately in the Render dashboard (never commit it to git)
      - key: SMTP_USER
        value: salomonsterk@gmail.com
      - key: SMTP_FROM
        value: salomonsterk@gmail.com
      - key: SMTP_PASS
        sync: false
